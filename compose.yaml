# Configuration locale pour apprendre Docker, indépendante de Render/Vercel.
services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend2
    init: true
    environment:
      # Mode local : cookies utilisables en HTTP sur localhost.
      NODE_ENV: development
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/djua_energy
      JWT_SECRET: ${DOCKER_JWT_SECRET:-local-docker-only-change-before-deploying-52f1a8d9}
      MQTT_PORT: "1883"
      MQTT_USER: ${DOCKER_MQTT_USER:-djua_local}
      MQTT_PASS: ${DOCKER_MQTT_PASS:-local-mqtt-only}
      IOT_AUTH_REQUIRED: "true"
      IOT_API_KEY: ${DOCKER_IOT_API_KEY:-local-iot-only}
      SWAGGER_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:1883:1883"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Cette adresse est utilisée par le navigateur sur ton PC.
        VITE_API_URL: http://localhost:5000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
